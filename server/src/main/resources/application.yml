spring:
  application:
    name: delta-finance
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DELTA_DB_HOST:localhost}:${DELTA_DB_PORT:5432}/${DELTA_DB_NAME:delta_finance}
    username: ${DELTA_DB_USER:delta}
    password: ${DELTA_DB_PASSWORD:delta}
    hikari:
      maximum-pool-size: ${DELTA_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${DELTA_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    com.deltafinance: INFO

info:
  app:
    name: Delta Finance
    version: @project.version@
