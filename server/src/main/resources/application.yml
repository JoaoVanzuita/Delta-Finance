spring:
  application:
    name: delta-finance
  profiles:
    default: local

  task:
    scheduling:
      pool:
        size: 2
      shutdown:
        await-termination: true
        await-termination-period: 30s

  datasource:
    url: jdbc:postgresql://${DELTA_DB_HOST:localhost}:${DELTA_DB_PORT:5432}/${DELTA_DB_NAME:delta_finance}
    username: ${DELTA_DB_USER:delta}
    password: ${DELTA_DB_PASSWORD:delta}
    hikari:
      maximum-pool-size: ${DELTA_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo

  lifecycle:
    timeout-per-shutdown-phase: 30s

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

server:
  port: ${DELTA_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-delta_session
        http-only: true
        secure: ${DELTA_COOKIE_SECURE:true}
        same-site: Lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,keyRing
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

delta:
  crypto:
    # Caminho local padrão; o Compose sobrescreve com /run/secrets/crypto-keys.json.
    key-file: ${DELTA_CRYPTO_KEY_FILE:./secrets/crypto-keys.json}
    active-version: ${DELTA_CRYPTO_ACTIVE_VERSION:1}
    index-key-version: ${DELTA_INDEX_KEY_VERSION:1}
    rotation:
      # Execução única via key-rotation; nunca agendada por padrão.
      run: ${DELTA_KEY_ROTATION_RUN:false}
  pluggy:
    base-url: ${DELTA_PLUGGY_BASE_URL:https://api.pluggy.ai}
    connection-limit: ${DELTA_PLUGGY_CONNECTION_LIMIT:5}
    connection-limit-checked-at: ${DELTA_PLUGGY_CONNECTION_LIMIT_CHECKED_AT:2026-10-22}
    request-timeout: 30s
  sync:
    initial-window-months: ${DELTA_SYNC_INITIAL_WINDOW_MONTHS:12}
    daily-window-days: ${DELTA_SYNC_DAILY_WINDOW_DAYS:7}
    reconciliation-window-months: ${DELTA_SYNC_RECONCILIATION_WINDOW_MONTHS:12}
    reconciliation-day-of-month: ${DELTA_SYNC_RECONCILIATION_DAY:1}
    scheduler-enabled: ${DELTA_SYNC_SCHEDULER_ENABLED:true}
    scheduler-interval: ${DELTA_SYNC_SCHEDULER_INTERVAL:1m}
    initial-delay: ${DELTA_SYNC_INITIAL_DELAY:30s}
    jitter: ${DELTA_SYNC_JITTER:60s}
    max-attempts: ${DELTA_SYNC_MAX_ATTEMPTS:5}
    retry-base: ${DELTA_SYNC_RETRY_BASE:30s}
    retry-max: ${DELTA_SYNC_RETRY_MAX:1h}
    batch-size: ${DELTA_SYNC_BATCH_SIZE:10}
  privacy:
    retention:
      # Expurgo diário: login_attempt 30 d, sync_run 90 d, audit_event 1 ano e
      # idempotency_key 24 h.
      enabled: ${DELTA_PRIVACY_RETENTION_ENABLED:true}
      cron: ${DELTA_PRIVACY_RETENTION_CRON:0 30 3 * * *}
  operator:
    reset:
      # Usado pelo runner operacional e pelo serviço de recuperação assistida.
      token: ${DELTA_OPERATOR_RESET_TOKEN:}
  security:
    sessions:
      absolute-timeout: 12h
    # Mantido por compatibilidade com instalações que usavam o nome anterior.
    # Token exclusivo do operador para recuperação assistida de senha (T197).
    # Vazio desabilita o mecanismo. Nunca é exposto por HTTP.
    operator-reset-token: ${DELTA_OPERATOR_RESET_TOKEN:}
    login:
      max-failures: 5
      window: 15m
      block-duration: 15m
    registration:
      # Controle em memória; uma reinicialização zera a janela.
      max-attempts: ${DELTA_REGISTRATION_MAX_ATTEMPTS:5}
      window: ${DELTA_REGISTRATION_WINDOW:1h}

logging:
  level:
    root: INFO
    com.deltafinance: INFO

info:
  app:
    name: Delta Finance
    version: @project.version@
