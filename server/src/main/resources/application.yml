spring:
  application:
    name: delta-finance
  profiles:
    default: local

  datasource:
    url: jdbc:postgresql://${DELTA_DB_HOST:localhost}:${DELTA_DB_PORT:5432}/${DELTA_DB_NAME:delta_finance}
    username: ${DELTA_DB_USER:delta}
    password: ${DELTA_DB_PASSWORD:delta}
    hikari:
      maximum-pool-size: ${DELTA_DB_POOL_SIZE:10}
      connection-timeout: 5000
      validation-timeout: 3000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
        query:
          in_clause_parameter_padding: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  jackson:
    time-zone: America/Sao_Paulo

  lifecycle:
    timeout-per-shutdown-phase: 30s

  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      table-name: SPRING_SESSION

server:
  port: ${DELTA_SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  servlet:
    session:
      timeout: 30m
      cookie:
        name: __Host-delta_session
        http-only: true
        secure: ${DELTA_COOKIE_SECURE:true}
        same-site: Lax
        path: /
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,keyRing
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    enabled: false

delta:
  crypto:
    # Caminho local padrão; o Compose sobrescreve com /run/secrets/crypto-keys.json.
    key-file: ${DELTA_CRYPTO_KEY_FILE:./secrets/crypto-keys.json}
    active-version: ${DELTA_CRYPTO_ACTIVE_VERSION:1}
    index-key-version: ${DELTA_INDEX_KEY_VERSION:1}
  security:
    sessions:
      absolute-timeout: 12h
    login:
      max-failures: 5
      window: 15m
      block-duration: 15m

logging:
  level:
    root: INFO
    com.deltafinance: INFO

info:
  app:
    name: Delta Finance
    version: @project.version@
