# Profile local: desenvolvimento na máquina do mantenedor.
# Não usar em produção; nenhum segredo real deve ser versionado aqui.
spring:
  datasource:
    url: jdbc:postgresql://${DELTA_DB_HOST:localhost}:${DELTA_DB_PORT:5432}/${DELTA_DB_NAME:delta_finance}
  jpa:
    properties:
      hibernate:
        format_sql: false

# Ao rodar `cd server && ./mvnw spring-boot:run`, o key ring do repositório está em ../secrets.
delta:
  crypto:
    key-file: ${DELTA_CRYPTO_KEY_FILE:../secrets/crypto-keys.json}

springdoc:
  swagger-ui:
    enabled: true

logging:
  level:
    com.deltafinance: DEBUG
    org.flywaydb: INFO
