components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-delta_session
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
    webhookSecret:
      type: apiKey
      in: header
      name: X-Webhook-Secret
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Recomendado para retries de mutações.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    AccountId:
      name: accountId
      in: query
      schema:
        type: string
        format: uuid
    CategoryId:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - DEBIT
        - CREDIT
        - TRANSFER
        - REFUND
        - CHARGEBACK
        - ADJUSTMENT
    Origin:
      name: origin
      in: query
      schema:
        type: string
        enum:
        - IMPORTED
        - MANUAL
    MinAmount:
      name: minAmount
      in: query
      schema:
        type: string
        pattern: ^-?\d+(\.\d+)?$
    MaxAmount:
      name: maxAmount
      in: query
      schema:
        type: string
        pattern: ^-?\d+(\.\d+)?$
    Period:
      name: period
      in: query
      schema:
        type: string
        enum:
        - WEEK
        - MONTH
        - YEAR
        default: MONTH
  responses:
    Unauthorized:
      description: Não autenticado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de estado ou unicidade.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validação falhou.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Limite de requisições atingido.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: 'Falha sanitizada do provedor externo. Códigos possíveis:
        `PROVIDER_AUTH_FAILED` (Client ID/Secret recusados, inclusive 400 por
        Client ID fora do formato UUID), `PROVIDER_RATE_LIMITED` (429; respeitar
        `Retry-After`) e `PROVIDER_UNAVAILABLE` (demais falhas de comunicação ou
        respostas inesperadas). Nenhum corpo bruto do provedor é repassado.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - message
              properties:
                field:
                  type: string
                message:
                  type: string
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    PasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    IntegrationCredentialsRequest:
      type: object
      required:
      - clientId
      - clientSecret
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
    Integration:
      type: object
      required:
      - id
      - provider
      - status
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - MEU_PLUGGY
        clientIdMasked:
          type: string
        status:
          type: string
          enum:
          - INCOMPLETE
          - ACTIVE
          - SYNCING
          - SYNCED
          - CREDENTIAL_FAILURE
          - ACTION_REQUIRED
          - AUTHORIZATION_EXPIRED
          - ITEM_UNAVAILABLE
        lastSyncAttemptAt:
          type: string
          format: date-time
        lastSuccessfulSyncAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
        connectionCount:
          type: integer
    ValidationResult:
      type: object
      required:
      - valid
      properties:
        valid:
          type: boolean
        message:
          type: string
        itemValidated:
          type: boolean
    Connection:
      type: object
      required:
      - id
      - status
      properties:
        id:
          type: string
          format: uuid
        itemIdMasked:
          type: string
        institutionName:
          type: string
        status:
          type: string
          enum:
          - INCOMPLETE
          - ACTIVE
          - SYNCING
          - SYNCED
          - CREDENTIAL_FAILURE
          - ACTION_REQUIRED
          - AUTHORIZATION_EXPIRED
          - ITEM_UNAVAILABLE
        consentExpiresAt:
          type: string
          format: date-time
        lastSyncAt:
          type: string
          format: date-time
        lastErrorCode:
          type: string
        accountCount:
          type: integer
    ConnectionCreateRequest:
      type: object
      required:
      - itemId
      properties:
        itemId:
          type: string
          description: UUID do item exibido em Itens Conectados na página Demo da
            aplicação no Dashboard Pluggy, criado pela mesma aplicação Meu Pluggy do
            Client ID autenticado. Não use o UUID da página de detalhes da conta
            (`accountId`). Item de outra aplicação, removido ou com formato inválido
            retorna 422.
    ConnectionUpdateRequest:
      type: object
      required:
      - itemId
      properties:
        itemId:
          type: string
          description: Novo UUID do item após reconexão, pertencente à mesma
            aplicação Meu Pluggy (não o UUID da conta). Não altera o ID local da
            conexão; item inválido/inexistente retorna 422 e mantém o vínculo
            anterior.
    ConnectionPage:
      type: object
      required:
      - items
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Connection'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    Account:
      type: object
      required:
      - id
      - type
      - origin
      - currency
      - currentBalance
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - BANK
          - CREDIT
          - CASH
          - WALLET
        subtype:
          type: string
        origin:
          type: string
          enum:
          - IMPORTED
          - MANUAL
        institutionName:
          type: string
        alias:
          type: string
        currency:
          type: string
        currentBalance:
          type: string
        balanceReferenceAt:
          type: string
          format: date-time
        status:
          type: string
          description: ACTIVE, INACTIVE, UNAVAILABLE ou CLOSED; contas manuais desativadas usam INACTIVE.
        lastSyncAt:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 500
        cardProfile:
          $ref: '#/components/schemas/CardProfile'
    ManualAccountRequest:
      type: object
      required:
      - type
      - alias
      - referenceBalance
      - referenceDate
      properties:
        type:
          type: string
          enum:
          - BANK
          - CASH
          - WALLET
        alias:
          type: string
        referenceBalance:
          type: string
          description: Saldo de referência informado pelo usuário.
        referenceDate:
          type: string
          format: date-time
        currency:
          type: string
          default: BRL
        notes:
          type: string
    AccountUpdateRequest:
      type: object
      description: Aplicável apenas a contas com origin=MANUAL; o type é imutável após a criação.
      properties:
        alias:
          type: string
        referenceBalance:
          type: string
        referenceDate:
          type: string
          format: date-time
        notes:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
    AccountList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Account'
    CardProfile:
      type: object
      required:
      - accountId
      - closingDay
      - dueDay
      - creditBalance
      properties:
        accountId:
          type: string
          format: uuid
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        creditLimit:
          type: string
        creditBalance:
          type: string
          description: Crédito acumulado do cartão para faturas futuras; não compõe income, expenses nem currentBalance.
    CardProfileRequest:
      type: object
      required:
      - closingDay
      - dueDay
      properties:
        closingDay:
          type: integer
          minimum: 1
          maximum: 31
        dueDay:
          type: integer
          minimum: 1
          maximum: 31
        creditLimit:
          type: string
    Transaction:
      type: object
      required:
      - id
      - accountId
      - source
      - type
      - status
      - postedOn
      - amount
      - currency
      - description
      properties:
        id:
          type: string
          format: uuid
        accountId:
          type: string
          format: uuid
        categoryId:
          type: string
          format: uuid
        categoryName:
          type: string
        source:
          type: string
          enum:
          - IMPORTED
          - MANUAL
        type:
          type: string
          enum:
          - DEBIT
          - CREDIT
          - TRANSFER
          - REFUND
          - CHARGEBACK
          - ADJUSTMENT
          description: Classificação do movimento; deve ser consistente com o sinal de amount.
        status:
          type: string
          enum:
          - PENDING
          - POSTED
          - SOURCE_REMOVED
          - RECONCILED
        postedOn:
          type: string
          format: date
        amount:
          type: string
          description: 'String decimal assinada: negativa para saída, positiva para entrada. O tipo deve
            ser consistente com o sinal.'
        currency:
          type: string
        description:
          type: string
        notes:
          type: string
          maxLength: 2000
          description: Observações do usuário; nunca sobrescritas pela sincronização.
        editedFields:
          type: array
          items:
            type: string
        reconciliationState:
          type: string
        invoiceId:
          type: string
          format: uuid
        relatedTransactionId:
          type: string
          format: uuid
          description: Transação original para reembolso/chargeback; deve pertencer ao mesmo usuário e
            conta.
        adjustmentReason:
          type: string
          maxLength: 500
          description: Motivo explícito para ajuste manual.
        counterpartTransactionId:
          type: string
          format: uuid
          description: Perna contraparte de uma transferência manual.
    TransactionPage:
      type: object
      required:
      - items
      - hasMore
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        nextCursor:
          type: string
        hasMore:
          type: boolean
    ManualTransactionRequest:
      type: object
      required:
      - accountId
      - type
      - postedOn
      - amount
      - description
      properties:
        accountId:
          type: string
          format: uuid
        type:
          type: string
          enum:
          - DEBIT
          - CREDIT
          - TRANSFER
          - REFUND
          - CHARGEBACK
          - ADJUSTMENT
        postedOn:
          type: string
          format: date
        amount:
          type: string
        description:
          type: string
          maxLength: 500
        categoryId:
          type: string
          format: uuid
        transferAccountId:
          type: string
          format: uuid
          description: Conta de destino; a conta de origem é accountId. Cria duas pernas vinculadas.
        relatedTransactionId:
          type: string
          format: uuid
          description: Transação original para reembolso/chargeback; obrigatória quando não houver correspondência automática.
