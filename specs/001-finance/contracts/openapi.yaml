components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-delta_session
    csrfToken:
      type: apiKey
      in: header
      name: X-XSRF-TOKEN
  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Chave de idempotência por operação, aceita apenas em transações,
        itens de fatura e pagamentos de fatura. Repetições com o mesmo método,
        caminho, query string e corpo recebem a resposta original por 24 h; corpo
        divergente retorna 409 IDEMPOTENCY_KEY_REUSED. Nas demais mutações o
        cabeçalho é ignorado.
      schema:
        type: string
        minLength: 8
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    DateFrom:
      name: from
      in: query
      schema:
        type: string
        format: date
    DateTo:
      name: to
      in: query
      schema:
        type: string
        format: date
    AccountId:
      name: accountId
      in: query
      schema:
        type: string
        format: uuid
    AccountIds:
      name: accountId
      in: query
      description: Repetível (accountId=a&accountId=b) ou separado por vírgula.
        Sem o parâmetro, todas as contas e cartões entram.
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
          format: uuid
    CategoryId:
      name: categoryId
      in: query
      schema:
        type: string
        format: uuid
    TransactionType:
      name: type
      in: query
      schema:
        type: string
        enum:
        - DEBIT
        - CREDIT
        - TRANSFER
        - REFUND
        - CHARGEBACK
        - ADJUSTMENT
    Origin:
      name: origin
      in: query
      schema:
        type: string
        enum:
        - IMPORTED
        - MANUAL
    MinAmount:
      name: minAmount
      in: query
      schema:
        type: string
        pattern: ^-?\d+(\.\d+)?$
    MaxAmount:
      name: maxAmount
      in: query
      schema:
        type: string
        pattern: ^-?\d+(\.\d+)?$
    Period:
      name: period
      in: query
      schema:
        type: string
        enum:
        - WEEK
        - MONTH
        - YEAR
        default: MONTH
  responses:
    Unauthorized:
      description: Não autenticado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Recurso não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Conflito de estado ou unicidade.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: Validação falhou.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
    TooManyRequests:
      description: Limite de requisições atingido.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    BadGateway:
      description: 'Falha sanitizada do provedor externo. Códigos possíveis:
        `PROVIDER_AUTH_FAILED` (Client ID/Secret recusados, inclusive 400 por
        Client ID fora do formato UUID), `PROVIDER_RATE_LIMITED` (429; respeitar
        `Retry-After`) e `PROVIDER_UNAVAILABLE` (demais falhas de comunicação ou
        respostas inesperadas). Nenhum corpo bruto do provedor é repassado.'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        requestId:
          type: string
    ValidationProblem:
      allOf:
      - $ref: '#/components/schemas/Problem'
      - type: object
        properties:
          errors:
            type: array
            items:
              type: object
              required:
              - field
              - message
              properties:
                field:
                  type: string
                message:
                  type: string
    User:
      type: object
      required:
      - id
      - username
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        createdAt:
          type: string
          format: date-time
    RegisterRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
        password:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          writeOnly: true
    PasswordChangeRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    IntegrationCredentialsRequest:
      type: object
      required:
      - clientId
      - clientSecret
      properties:
        clientId:
          type: string
        clientSecret:
          type: string
          writeOnly: true
    Integration:
      type: object
      required:
      - id
      - provider
      - status
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum:
          - MEU_PLUGGY
        clientIdMasked:
          type: string
        status:
          type: string
          enum:
