          format: uuid
        invoiceItemId:
          type: string
          format: uuid
        fieldName:
          type: string
        oldValue:
          type: string
        newValue:
          type: string
        reason:
          type: string
        changedAt:
          type: string
          format: date-time
    InvoiceItemRequest:
      type: object
      required:
      - kind
      - reportingEffect
      - description
      - amount
      - occurredOn
      properties:
        kind:
          type: string
          enum:
          - PURCHASE
          - INSTALLMENT
          - INTEREST
          - FEE
          - TAX
          - CREDIT
          - REFUND
          - MANUAL_ADJUSTMENT
        transactionId:
          type: string
          format: uuid
          description: Obrigatório para PURCHASE e INSTALLMENT; deve pertencer ao mesmo usuário e cartão.
        reportingEffect:
          type: string
          enum:
          - EXPENSE_INCREASE
          - EXPENSE_DECREASE
          - NONE
          description: Obrigatório; use NONE para itens espelho.
        description:
          type: string
          maxLength: 500
        amount:
          type: string
          description: Magnitude positiva.
        occurredOn:
          type: string
          format: date
        installmentNumber:
          type: integer
        totalInstallments:
          type: integer
      allOf:
      - if:
          properties:
            kind:
              enum:
              - PURCHASE
              - INSTALLMENT
          required:
          - kind
        then:
          required:
          - transactionId
          properties:
            transactionId:
              type: string
              format: uuid
