openapi: 3.1.0
info:
  title: Delta Finance API
  version: 1.0.0
  description: 'Contrato do MVP de finanças pessoais familiares. A API é same-origin em

    produção, usa sessão por cookie e CSRF por cookie + header. Valores

    monetários trafegam como strings decimais para evitar ponto flutuante. O

    contrato cobre 37 caminhos do MVP e 2 caminhos de investimentos da fase

    secundária (US8).

    '
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /api/v1
tags:
- name: Auth
  description: Cadastro, login, sessão, senha e CSRF.
- name: Integrations
  description: Credenciais pessoais e estado da integração Meu Pluggy.
- name: Connections
  description: Itens/conexões, itemIds e sincronização disponível.
- name: Accounts
  description: Contas bancárias, cartões, perfis e saldos.
- name: Transactions
  description: Importação, listagem, criação manual e correções.
- name: Categories
  description: Categorias predefinidas e personalizadas.
- name: Invoices
  description: Ciclos, faturas, itens, pagamentos e encargos.
- name: Reconciliation
  description: Sugestões de transferência e pagamento de fatura.
- name: Dashboard
  description: Resumo, categorias, série temporal e drill-down.
- name: Sync
  description: Estado e histórico de sincronizações.
- name: Privacy
  description: Exportação, desconexão e exclusão de conta.
- name: Investments
  description: Posições manuais de investimentos (fase secundária pós-MVP).
- name: Webhooks
  description: Recepção opcional de eventos Pluggy.
security:
- sessionCookie: []
paths:
  /auth/csrf:
    get:
      tags:
      - Auth
      summary: Obtém o cookie CSRF
      security: []
      responses:
        '204':
          description: Cookie XSRF-TOKEN definido.
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: getAuthCsrf
  /auth/register:
    post:
      tags:
      - Auth
      summary: Cria uma conta
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Conta criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postAuthRegister
  /auth/login:
    post:
      tags:
      - Auth
      summary: Autentica e cria sessão
      security:
      - csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sessão criada.
          headers:
            Set-Cookie:
              description: Cookie de sessão seguro.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      operationId: postAuthLogin
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Encerra a sessão
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Sessão encerrada.
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: postAuthLogout
  /auth/me:
    get:
      tags:
      - Auth
      summary: Retorna o usuário autenticado
      responses:
        '200':
          description: Usuário autenticado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAuthMe
  /auth/password:
    put:
      tags:
      - Auth
      summary: Altera a senha e encerra outras sessões
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Senha alterada.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: putAuthPassword
  /integrations/pluggy:
    get:
      tags:
      - Integrations
      summary: Consulta a integração pessoal
      responses:
        '200':
          description: Configuração atual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getIntegrationsPluggy
    put:
      tags:
      - Integrations
      summary: Cria ou atualiza as credenciais pessoais
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCredentialsRequest'
      responses:
        '200':
          description: Credenciais validadas e salvas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
      operationId: putIntegrationsPluggy
    delete:
      tags:
      - Integrations
      summary: Desconecta a integração
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: deleteImportedData
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: Integração desconectada.
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: deleteIntegrationsPluggy
  /integrations/pluggy/validate:
    post:
      tags:
      - Integrations
      summary: Valida credenciais sem salvar
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationCredentialsRequest'
      responses:
        '200':
          description: Credenciais válidas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationResult'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '502':
          $ref: '#/components/responses/BadGateway'
      operationId: postIntegrationsPluggyValidate
  /connections:
    get:
      tags:
      - Connections
      summary: Lista as conexões do usuário
      responses:
        '200':
          description: Conexões.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getConnections
    post:
      tags:
      - Connections
      summary: Cadastra um itemId
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionCreateRequest'
      responses:
        '201':
          description: Conexão validada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Configuração incompleta ou itemId inválido/inexistente para a
            aplicação Meu Pluggy (campo `itemId` em `errors`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '502':
          $ref: '#/components/responses/BadGateway'
      operationId: postConnections
  /connections/{id}:
    parameters:
    - $ref: '#/components/parameters/PathId'
    patch:
      tags:
      - Connections
      summary: Atualiza o itemId após renovação
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectionUpdateRequest'
      responses:
        '200':
          description: Conexão atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Connection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: itemId inválido/inexistente para a aplicação Meu Pluggy
            (campo `itemId` em `errors`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ValidationProblem'
        '502':
          $ref: '#/components/responses/BadGateway'
      operationId: patchConnectionsId
    delete:
      tags:
      - Connections
      summary: Remove uma conexão e interrompe novas sincronizações
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: deleteHistory
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '204':
          description: Conexão removida.
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteConnectionsId
  /connections/{id}/sync:
    post:
      tags:
      - Connections
      summary: Consulta os dados disponíveis agora
      description: 'Não força uma atualização na instituição de origem. Apenas lê o que já

        está disponível e enfileira a reconciliação.

        '
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Sincronização enfileirada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncAccepted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conexão sem itemId válido (código `CONNECTION_UNAVAILABLE`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: postConnectionsIdSync
  /accounts:
    get:
      tags:
      - Accounts
      summary: Lista contas e cartões
      responses:
        '200':
          description: Contas do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '401':
          $ref: '#/components/responses/Unauthorized'
      operationId: getAccounts
    post:
      tags:
      - Accounts
      summary: Cria uma conta manual
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAccountRequest'
      responses:
        '201':
          description: Conta manual criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: postAccounts
  /accounts/{id}:
    get:
      tags:
      - Accounts
      summary: Detalha uma conta ou cartão
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getAccountsId
    patch:
      tags:
      - Accounts
      summary: Edita ou desativa uma conta manual
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdateRequest'
      responses:
        '200':
          description: Conta manual atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conta importada não pode ser editada manualmente.
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: patchAccountsId
  /cards/{accountId}/profile:
    put:
      tags:
      - Accounts
      summary: Configura ciclo e limite do cartão
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardProfileRequest'
      responses:
        '200':
          description: Perfil atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: putCardsAccountIdProfile
  /transactions:
    get:
      tags:
      - Transactions
      summary: Lista transações com filtros
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/DateFrom'
      - $ref: '#/components/parameters/DateTo'
      - $ref: '#/components/parameters/AccountId'
      - $ref: '#/components/parameters/CategoryId'
      - $ref: '#/components/parameters/TransactionType'
      - $ref: '#/components/parameters/Origin'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - POSTED
          - SOURCE_REMOVED
          - RECONCILED
      - $ref: '#/components/parameters/MinAmount'
      - $ref: '#/components/parameters/MaxAmount'
      responses:
        '200':
          description: Página de transações.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: getTransactions
    post:
      tags:
      - Transactions
      summary: Cria um lançamento manual
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualTransactionRequest'
      responses:
        '201':
          description: Lançamento criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: postTransactions
  /transactions/{id}:
    parameters:
    - $ref: '#/components/parameters/PathId'
    patch:
      tags:
      - Transactions
      summary: Corrige uma transação importada ou manual
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionCorrectionRequest'
      responses:
        '200':
          description: Transação corrigida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: patchTransactionsId
    delete:
      tags:
      - Transactions
      summary: Exclui um lançamento manual
      description: Transações importadas não são apagadas; a remoção do histórico exige reconciliação explícita (`SOURCE_REMOVED`) ou exclusão da conta.
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Lançamento manual excluído.
        '409':
          $ref: '#/components/responses/Conflict'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: deleteTransactionsId
  /transactions/{id}/source-removal:
    parameters:
    - $ref: '#/components/parameters/PathId'
    post:
      tags:
      - Transactions
      summary: Revisa uma transação marcada como removida na origem
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceRemovalReviewRequest'
      responses:
        '200':
          description: Revisão registrada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: postTransactionsIdSourceRemoval
  /categories:
    get:
      tags:
      - Categories
      summary: Lista categorias
      responses:
        '200':
          description: Categorias do usuário.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryList'
        4XX:
          description: Erro do cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: getCategories
    post:
      tags:
      - Categories
      summary: Cria uma categoria
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '201':
          description: Categoria criada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        '409':
          $ref: '#/components/responses/Conflict'
      operationId: postCategories
  /categories/{id}:
    parameters:
    - $ref: '#/components/parameters/PathId'
    patch:
      tags:
      - Categories
      summary: Edita uma categoria
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryRequest'
      responses:
        '200':
          description: Categoria atualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Category'
        4XX:
          description: Erro do cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: patchCategoriesId
    delete:
      tags:
      - Categories
      summary: Desativa uma categoria
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - name: reassignTo
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Categoria desativada; transações reatribuídas ou sem categoria.
        4XX:
          description: Erro do cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: deleteCategoriesId
  /cards/{accountId}/invoices:
    get:
      tags:
      - Invoices
      summary: Lista faturas de um cartão
      parameters:
      - name: accountId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Faturas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getCardsAccountIdInvoices
  /invoices/{id}:
    get:
      tags:
      - Invoices
      summary: Detalha uma fatura
      parameters:
      - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Fatura com itens e pagamentos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetail'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getInvoicesId
  /invoices/{id}/items:
    post:
      tags:
      - Invoices
      summary: Adiciona item manual à fatura
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceItemRequest'
      responses:
        '201':
          description: Item criado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceItem'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: postInvoicesIdItems
  /invoice-items/{id}:
    parameters:
    - $ref: '#/components/parameters/PathId'
    patch:
      tags:
      - Invoices
      summary: Edita item manual de fatura
      security:
      - sessionCookie: []
        csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoiceItemRequest'
      responses:
        '200':
          description: Item atualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceItem'
        4XX:
          description: Erro do cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: patchInvoiceItemsId
    delete:
      tags:
      - Invoices
      summary: Remove logicamente um item de fatura
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '204':
          description: Item removido.
        4XX:
          description: Erro do cliente.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      operationId: deleteInvoiceItemsId
  /invoice-items/{id}/corrections:
    parameters:
    - $ref: '#/components/parameters/PathId'
    get:
      tags:
      - Invoices
      summary: Lista o histórico de correções do item
      security:
      - sessionCookie: []
        csrfToken: []
      responses:
        '200':
          description: Histórico de correções.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceItemCorrection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: getInvoiceItemsIdCorrections
  /invoices/{id}/payments:
    post:
      tags:
      - Invoices
      summary: Registra pagamento total ou parcial
      security:
      - sessionCookie: []
        csrfToken: []
      parameters:
      - $ref: '#/components/parameters/PathId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvoicePaymentRequest'
      responses:
        '201':
          description: Pagamento registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePayment'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
      operationId: postInvoicesIdPayments
  /internal-matches:
    get:
      tags:
      - Reconciliation
      summary: Lista sugestões de movimentos internos
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - CONFIRMED
          - REJECTED
          default: PENDING
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Sugestões.
          content:
