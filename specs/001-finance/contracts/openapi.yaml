    InvoiceItem:
      type: object
      required:
      - id
      - invoiceId
      - kind
      - reportingEffect
      - source
      - description
      - amount
      - occurredOn
      properties:
        id:
          type: string
          format: uuid
        invoiceId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - PURCHASE
          - INSTALLMENT
          - INTEREST
          - FEE
          - TAX
          - CREDIT
          - REFUND
          - MANUAL_ADJUSTMENT
        reportingEffect:
          type: string
          enum:
          - EXPENSE_INCREASE
          - EXPENSE_DECREASE
          - NONE
          description: Direção do efeito; o valor é sempre magnitude positiva.
        source:
          type: string
          enum:
          - IMPORTED
          - MANUAL
          - PROVIDER_BILL
        description:
          type: string
        amount:
          type: string
          description: Magnitude positiva; a direção vem de reportingEffect.
        occurredOn:
          type: string
          format: date
        installmentNumber:
          type: integer
        totalInstallments:
          type: integer
        correctionCount:
          type: integer
          minimum: 0
          description: Quantidade de correções auditadas do item.
      allOf:
      - if:
          properties:
            kind:
              enum:
              - PURCHASE
              - INSTALLMENT
          required:
          - kind
        then:
          required:
          - transactionId
          properties:
            transactionId:
              type: string
              format: uuid
    InvoiceItemCorrection:
      type: object
