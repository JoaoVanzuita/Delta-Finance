          type: string
          enum:
          - DEBIT
          - CREDIT
          - TRANSFER
          - REFUND
          - CHARGEBACK
          - ADJUSTMENT
          description: Classificação do movimento; deve ser consistente com o sinal de amount.
        status:
          type: string
          enum:
          - PENDING
          - POSTED
          - SOURCE_REMOVED
          - RECONCILED
          description: Status efetivo. SOURCE_REMOVED é aplicado automaticamente
            quando a transação desaparece de uma leitura conclusiva e não vazia;
            se ela reaparecer, o status volta ao valor atual da origem.
        postedOn:
          type: string
          format: date
        amount:
