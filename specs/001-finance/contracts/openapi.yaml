        currency:
          type: string
        description:
          type: string
        notes:
          type: string
          maxLength: 2000
          description: Observações do usuário; nunca sobrescritas pela sincronização.
        editedFields:
          type: array
          items:
            type: string
        reconciliationState:
          type: string
          description: NONE, PENDING_MATCH, MATCHED ou SOURCE_REMOVED. Neste
            último, a transação está ausente na origem e fora dos totais; a
            restauração é automática se o identificador reaparecer.
