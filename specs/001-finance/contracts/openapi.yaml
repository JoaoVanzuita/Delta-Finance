          type: string
          format: date
        dueDate:
          type: string
          format: date
        status:
          type: string
          enum:
          - OPEN
          - CLOSED
          - PARTIALLY_PAID
          - PAID
          - OVERDUE
        total:
          type: string
        paymentsTotal:
          type: string
        outstanding:
          type: string
          description: total menos appliedCredit e paymentsTotal, nunca negativo.
        appliedCredit:
          type: string
          description: Crédito acumulado de faturas anteriores aplicado a esta fatura; não inclui itens de crédito/estorno desta fatura e não compõe income nem expenses.
        minimumPayment:
          type: string
        source:
          type: string
          enum:
          - LOCAL
          - PROVIDER
        hasAdjustments:
          type: boolean
          description: Indica ajuste manual em fatura fechada/paga; não substitui o status de pagamento.
        adjustmentCount:
          type: integer
          minimum: 0
          description: Quantidade de ajustes manuais.
    InvoiceDetail:
