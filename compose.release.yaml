# Stack de release do Delta Finance.
#
# Uso no kit distribuído:
#   cp .env.example .env
#   docker compose pull
#   docker compose up -d
#
# Serviços: db (PostgreSQL 18.6), server (Spring Boot) e client (SPA + Caddy).
# O backend e o banco não são publicados no host. O client é o único ponto de
# entrada e encaminha /api/* para server:8080.

name: delta-finance

services:
  db:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DELTA_DB_NAME}
      POSTGRES_USER: ${DELTA_DB_USER}
      POSTGRES_PASSWORD: ${DELTA_DB_PASSWORD}
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    volumes:
      # PostgreSQL 18+ espera o volume em /var/lib/postgresql (dados em
      # subdiretório versionado), não em /var/lib/postgresql/data.
      - pgdata:/var/lib/postgresql
    networks:
      - data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  server:
    image: 'ghcr.io/${DELTA_IMAGE_OWNER:-joaovanzuita}/delta-finance-server:${DELTA_VERSION:?defina DELTA_VERSION}'
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DELTA_DEPLOYMENT_MODE: tls
      DELTA_DB_HOST: db
      DELTA_DB_PORT: 5432
      DELTA_DB_NAME: ${DELTA_DB_NAME}
      DELTA_DB_USER: ${DELTA_DB_USER}
      DELTA_DB_PASSWORD: ${DELTA_DB_PASSWORD}
      DELTA_DB_POOL_SIZE: ${DELTA_DB_POOL_SIZE:-10}
      DELTA_TRUSTED_PROXY_HOPS: 1
      DELTA_HTTP_ASYNC_TIMEOUT: ${DELTA_HTTP_ASYNC_TIMEOUT:-5m}
      DELTA_CRYPTO_KEY_FILE: /run/secrets/crypto-keys.json
      DELTA_CRYPTO_ACTIVE_VERSION: ${DELTA_CRYPTO_ACTIVE_VERSION:-1}
      DELTA_INDEX_KEY_VERSION: ${DELTA_INDEX_KEY_VERSION:-1}
      DELTA_KEY_ROTATION_RUN: ${DELTA_KEY_ROTATION_RUN:-false}
      DELTA_PLUGGY_BASE_URL: ${DELTA_PLUGGY_BASE_URL:-https://api.pluggy.ai}
      DELTA_PLUGGY_CONNECTION_LIMIT: ${DELTA_PLUGGY_CONNECTION_LIMIT:-5}
      DELTA_PLUGGY_CONNECTION_LIMIT_CHECKED_AT: ${DELTA_PLUGGY_CONNECTION_LIMIT_CHECKED_AT:-2026-10-22}
      DELTA_SYNC_SCHEDULER_ENABLED: ${DELTA_SYNC_SCHEDULER_ENABLED:-true}
      DELTA_SYNC_SCHEDULER_INTERVAL: ${DELTA_SYNC_SCHEDULER_INTERVAL:-1m}
      DELTA_SYNC_DAILY_WINDOW_DAYS: ${DELTA_SYNC_DAILY_WINDOW_DAYS:-7}
      DELTA_SYNC_INITIAL_WINDOW_MONTHS: ${DELTA_SYNC_INITIAL_WINDOW_MONTHS:-12}
      DELTA_SYNC_RECONCILIATION_WINDOW_MONTHS: ${DELTA_SYNC_RECONCILIATION_WINDOW_MONTHS:-12}
      DELTA_SYNC_RECONCILIATION_DAY: ${DELTA_SYNC_RECONCILIATION_DAY:-1}
      DELTA_SYNC_JITTER: ${DELTA_SYNC_JITTER:-60s}
      DELTA_SYNC_MAX_ATTEMPTS: ${DELTA_SYNC_MAX_ATTEMPTS:-5}
      DELTA_SYNC_BATCH_SIZE: ${DELTA_SYNC_BATCH_SIZE:-10}
      DELTA_OPERATOR_RESET_TOKEN: ${DELTA_OPERATOR_RESET_TOKEN:-}
      TZ: America/Sao_Paulo
    secrets:
      # Key ring externo ao banco e à imagem; montado somente leitura em /run/secrets.
      - source: crypto_keys
        target: crypto-keys.json
    # O arquivo do key ring é 0640 no host; o processo (uid app) entra no grupo
    # proprietário do arquivo para conseguir lê-lo sem torná-lo público.
    group_add:
      - '${DELTA_KEYRING_GID:-1000}'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -fsS http://127.0.0.1:8080/actuator/health/readiness || exit 1',
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    stop_grace_period: 45s
    mem_limit: ${DELTA_SERVER_MEM_LIMIT:-1g}
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  client:
    image: 'ghcr.io/${DELTA_IMAGE_OWNER:-joaovanzuita}/delta-finance-client:${DELTA_VERSION:?defina DELTA_VERSION}'
    restart: unless-stopped
    environment:
      # Hostname ou IP usado no certificado da CA interna. A escolha fica
      # pendente; o valor precisa ser definido no .env antes do primeiro start.
      DELTA_LAN_HOST: ${DELTA_LAN_HOST:?defina DELTA_LAN_HOST}
    ports:
      # Portas padrão no host para preservar HSTS e uma URL amigável. O Caddy
      # dentro do container continua sem privilégios nas portas 8080/8443.
      - '${LAN_HTTP_PORT:-80}:8080'
      - '${LAN_HTTPS_PORT:-443}:8443'
    volumes:
      # Persiste a CA local e os certificados entre atualizações.
      - caddy_data:/data
    depends_on:
      server:
        condition: service_healthy
    networks:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

secrets:
  crypto_keys:
    file: ./secrets/crypto-keys.json

volumes:
  pgdata:
    # Nome explícito para produção nunca reutilizar o volume de desenvolvimento.
    name: delta-finance-prod_pgdata
  caddy_data:
    # CA interna e certificados TLS; perder este volume exige reconfiar a CA
    # em todos os dispositivos.
    name: delta-finance-prod_caddy_data

networks:
  app:
  data:
